[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name, which is what `pip install` takes. It differs from the import name
# on purpose: `limelight` is already taken on PyPI by an unrelated package, so
# `pip install limelight` would fetch that one instead of this. The import name and the
# console script both stay `limelight`; only the name pip resolves changes.
name = "limelight"
version = "2.0.1"
description = "Local control of Xiaomi-ecosystem lights without a vendor application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "smartwhale8" }]
keywords = ["miio", "xiaomi", "philips", "iot", "home-automation", "smart-lighting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]

dependencies = [
  # An abstract range, so the package stays installable alongside others. The concrete
  # versions we build and test against are pinned in constraints.txt.
  #
  # Capped below 0.6 deliberately: python-miio is a 0.x project, so under semantic
  # versioning the MINOR version carries breaking changes, and 0.6 is a large refactor
  # adding MIoT support and an introspectable API. 0.5.12 is both the current stable
  # release and the last of the 0.5 line, so this admits only a future 0.5.x patch.
  # Moving to 0.6 should be a deliberate migration, never a silent one.
  "python-miio>=0.5.12,<0.6",
]

[project.optional-dependencies]
# The HTTP service. The CLI and the drivers work without these.
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
dev = [
  # Self-reference by DISTRIBUTION name, not import name. Getting this wrong would make
  # `pip install -e ".[dev]"` pull the unrelated `limelight` package from PyPI.
  "limelight[server]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # starlette's TestClient needs an HTTP client. Recent versions require httpx2 and
  # raise StarletteDeprecationWarning if only httpx is present, which the suite treats
  # as an error. Both are listed so the client is satisfied across starlette versions:
  # newer starlette selects httpx2, older selects httpx.
  "httpx2>=2.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
limelight = "limelight.cli:main"
limelight-server = "limelight.server:main"

[project.urls]
Homepage = "https://github.com/smartwhale8/limelight"
Repository = "https://github.com/smartwhale8/limelight"
Issues = "https://github.com/smartwhale8/limelight/issues"
Documentation = "https://github.com/smartwhale8/limelight/tree/main/docs"
Changelog = "https://github.com/smartwhale8/limelight/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["limelight"]

# An explicit include list rather than exclusions, so the contents do not depend on what
# happens to be on disk. The release workflow builds the Android APK before packing the
# sdist, and hatchling does not honour nested .gitignore files, so android/app/build was
# being swept in: v1.1.0 shipped a 16 MB source distribution.
[tool.hatch.build.targets.sdist]
include = [
  "/limelight",
  "/tests",
  "/tools",
  "/docs",
  "/packaging",
  "/constraints.txt",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
]

# ------------------------------------------------------------------------------ tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# Hardware tests are deselected by default: they need a real adopted device and they
# change its state. Run them deliberately with `pytest -m hardware`.
addopts = "-q --strict-markers --strict-config -m 'not hardware'"
markers = [
  "hardware: runs against a real adopted device; deselected unless -m hardware is given",
]
# Warnings from our own code are errors. Each exemption below is a specific upstream
# issue, matched as narrowly as possible so a new warning still fails the build.
filterwarnings = [
  "error",
  # python-miio uses deprecated APIs internally, including datetime.utcnow().
  "default::DeprecationWarning:miio.*",
  "default::DeprecationWarning:pkg_resources.*",
  # python-miio's MiotValueType puts functools.partial members in an Enum, which
  # Python 3.13 warns about at import. Matched on the message rather than the module,
  # because the warning is issued from enum.py rather than from miio.
  "default:functools\\.partial will be a method descriptor:FutureWarning",
  # python-miio opens a UDP socket per call and closes none. Measured over thirty
  # consecutive commands, descriptors do not accumulate: CPython reclaims each socket by
  # refcounting as it leaves scope. The socket is a local inside the library, so there is
  # nothing callers can close. Only the hardware tests construct enough transports to
  # trip this, and pytest promotes it to an error via the unraisable hook.
  "default::ResourceWarning",
]

[tool.coverage.run]
source = ["limelight"]
omit = ["limelight/web.py"]        # a template string, not logic

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

# ------------------------------------------------------------------------------- lint

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["limelight/web.py"]     # a large embedded HTML/JS string

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "D",         # docstrings
]
ignore = [
  "D102",      # methods; the class docstring and type signature carry the meaning
  "D103",      # small functions and route handlers, which have FastAPI summaries
  "D105",      # magic methods
  "D107",      # __init__; the class docstring covers construction
  "D203",      # incompatible with D211
  "D213",      # incompatible with D212
  "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]       # test names are the documentation
"tools/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
