name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff -c constraints.txt
      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the version used for development. The versions between
        # them sit inside a tested range and have never diverged from it, so testing them
        # costs runner time without buying coverage.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # -c pins the whole tree to the versions recorded in constraints.txt, so a red
        # build means a change here broke something, not that a dependency shipped.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Test
        # The whole suite runs without hardware: device access goes through an
        # in-memory fake, and the transport tests use a loopback UDP responder.
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  android:
    name: Build the Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK, so the Kotlin client is compiled
      # here. That matters: the miIO codec cannot be exercised against hardware in CI, and
      # this is what proves the app at least builds.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lamplight-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          # Builds between releases stay fetchable for as long as GitHub allows.
          retention-days: 90

  secrets:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject anything that looks like a real device token
        # A miIO token is 32 hex characters and is a complete credential. The
        # placeholders this project uses are a run of a single character, or the
        # obviously-sequential 0123456789abcdef pair, so a genuine token stands out.
        #
        # Implemented in Python rather than grep: backreferences are not portable
        # across grep implementations, and a false pass here would be worse than none.
        run: python .github/scripts/check_tokens.py
      - name: Reject a committed configuration file
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)config\.json$|wifi_pass|\.token$' ; then
            echo "::error::A file that may contain credentials is tracked."
            exit 1
          fi
          echo "No credential-bearing files tracked."
