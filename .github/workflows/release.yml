name: Release

# Publishes a downloadable APK and Python distribution against a version tag.
#
# CI already builds the APK on every push, but those artifacts expire and require a
# GitHub login to fetch. A release is permanent, versioned and directly downloadable,
# which is what makes it a sensible place to keep an installable build. The binary is
# deliberately not committed to the repository: at roughly 16 MB per build it would grow
# the history without bound.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Or run it by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for a manual run"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A debug build, deliberately. A release build needs a signing keystore, and an
      # unsigned release APK will not install. The debug APK installs by sideloading and
      # is the right artifact for personal use. See android/README.md if signing is added.
      - name: Build the Android client
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK after the tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/lamplight-${TAG}.apk"
          ls -lh release/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the Python distribution
        run: |
          pip install build -c constraints.txt
          python -m build --outdir release/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.whl
            release/*.tar.gz
          body: |
            ## Install

            **Android.** Download the `.apk` below and sideload it. You will need to allow
            installation from your browser or file manager the first time. The app finds
            the lamp on your Wi-Fi by itself and needs nothing else running.

            **Python service.** `pip install lamplight-*.whl`, then `lamplight discover`
            and `lamplight adopt --auto`.

            The APK is a debug build, so it is signed with the standard debug key rather
            than a release key. That is fine for sideloading and means it cannot be
            published to Play without resigning.
